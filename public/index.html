<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obee, AI College Advisor</title>
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
<meta name="description" content="Obee is a free AI college advisor for high school and community college transfer students. Have a real conversation and get a personalized, honest list of schools that actually fit you.">
<link rel="canonical" href="https://www.hiobee.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Obee">
<meta property="og:title" content="Obee, AI College Advisor">
<meta property="og:description" content="Obee is a free AI college advisor for high school and community college transfer students. Have a real conversation and get a personalized, honest list of schools that actually fit you.">
<meta property="og:url" content="https://www.hiobee.com/">
<meta property="og:image" content="https://www.hiobee.com/assets/banner-obee.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Obee, AI College Advisor">
<meta name="twitter:description" content="Obee is a free AI college advisor for high school and community college transfer students. Have a real conversation and get a personalized, honest list of schools that actually fit you.">
<meta name="twitter:image" content="https://www.hiobee.com/assets/banner-obee.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Schoolbell&family=Elms+Sans:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Obee",
  "url": "https://www.hiobee.com/",
  "logo": "https://www.hiobee.com/assets/obee-full-lockup.png",
  "description": "Obee is a free AI college advisor for high school and community college transfer students, offering a personalized, honest list of schools that actually fit them."
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What's different between Obee and just asking ChatGPT or Claude directly?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Anyone can open ChatGPT or Claude and ask for college advice, but a plain AI chat will answer confidently even when it's guessing, and only admit it later once you catch the mistake yourself. Obee is built specifically to prevent that: a full structured intake gathers exactly what a real admissions decision depends on, and if that still isn't enough, Obee asks another question instead of guessing. Every recommendation is checked against real, documented systems, like California's ASSIST, TAG, and IGETC transfer agreements, and explicitly tagged as verified, general, or unknown."
      }
    },
    {
      "@type": "Question",
      "name": "How much does it cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Obee is completely free for students. No login, no accounts, just your email once so we can send you a copy of your list."
      }
    },
    {
      "@type": "Question",
      "name": "Does it replace traditional counseling?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No, Obee is a trustworthy starting point, not the final word. We always recommend verifying with your school counselor and each college's official site."
      }
    },
    {
      "@type": "Question",
      "name": "Is my child's information safe and private?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. We don't require accounts, and your academic profile (grades, courses, extracurriculars) stays in your own browser, never on our servers. The one thing we collect is your email, used once to send you a copy of your list through our email provider, and not stored by us afterward."
      }
    }
  ]
}
</script>
</head>
<body>

<!-- ============ HEADER (persistent across every screen) ============ -->
<header id="app-header">
  <button class="header-logo-btn" id="logo-home-btn" type="button" aria-label="Obee home">
    <img class="header-logo-img" src="assets/obee-full-lockup-777.png" alt="Obee">
  </button>
  <div class="lang-switcher">
    <button class="lang-btn" id="lang-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Change language">
      <img class="lang-btn-icon" src="assets/languages.webp" alt="">
    </button>
    <div class="lang-dropdown" id="lang-dropdown"></div>
  </div>
</header>

<p class="sr-only">Obee is an AI college advisor that helps high school and community college transfer students find personalized, verified college recommendations through a real conversation, not a static database search.</p>

<!-- ============ MAIN APP ROOT -- everything renders here via JS ============ -->
<main id="app-root"></main>

<!-- ============ TEMPLATES ============ -->

<template id="tpl-home">
  <section class="screen home-screen">

    <!-- HERO -->
    <div class="hero">
      <h1 class="hero-quote">&ldquo;Education is the most powerful weapon <span class="quote-regular">which you can use to change the world&rdquo;</span></h1>
      <p class="hero-cite">Nelson Mandela</p>
      <p class="hero-sub">Obee, the friend who's got your back through every step of finding the right&nbsp;college.</p>
      <button class="cta-pill cta-pill--soft js-start" type="button">Start with Obee</button>
    </div>

    <!-- APP CARD 1 -->
    <div class="app-card app-card--video">
      <div class="app-card-main app-card-main--compact">
        <h3 class="card-title">Your college list, minus the guesswork.</h3>
        <p class="card-body">Hi! I'm Obee, your AI college counselor. I'm here as your friend, and I'll guide you through every step of your college application journey.</p>
        <p class="card-body">Tell me about your grades, interests, and budget, and I'll create a personalized list of universities that are safe, the right fit for your profile, and highly competitive, all in just a few minutes. It's the kind of college guidance that typically costs thousands of dollars with a private admissions consultant.</p>
        <button class="cta-pill cta-pill--dark js-start" type="button">Let's Find Your College</button>
      </div>
      <div class="app-card-panel app-card-panel--video">
        <video class="promo-video" loop muted playsinline preload="none" data-src="assets/obee-promo-sm.mp4"></video>
      </div>
    </div>

    <!-- APP CARD 2 -->
    <div class="app-card">
      <div class="app-card-main">
        <div class="features-grid">
          <span class="feature-item"><img class="feature-emoji" src="assets/puzzle.webp" alt="" loading="lazy" decoding="async"> Integrated</span>
          <span class="feature-item"><img class="feature-emoji" src="assets/secure.webp" alt="" loading="lazy" decoding="async"> Secure</span>
          <span class="feature-item"><img class="feature-emoji" src="assets/hands.webp" alt="" loading="lazy" decoding="async"> Open</span>
          <span class="feature-item"><img class="feature-emoji" src="assets/engine.webp" alt="" loading="lazy" decoding="async"> Reliable</span>
          <span class="feature-item"><img class="feature-emoji" src="assets/money.webp" alt="" loading="lazy" decoding="async"> Affordable</span>
          <span class="feature-item"><img class="feature-emoji" src="assets/honest.webp" alt="" loading="lazy" decoding="async"> Honest</span>
        </div>
      </div>
      <div class="app-card-panel">
        <img class="panel-feature-img" src="assets/launchyourfuture.webp" alt="" loading="lazy" decoding="async">
        <button class="cta-pill js-start" type="button">Launch your future</button>
      </div>
    </div>

    <!-- FLOW DIAGRAM -- a self-cycling carousel, one step at a time: a big
         category illustration on the left, its label typed on letter by
         letter (left to right) on the right -->
    <div class="flow-cascade">
      <div class="flow-dot-field"></div>
      <div class="flow-carousel">
        <div class="flow-carousel-card">
          <img class="flow-carousel-img" src="assets/tellobee.webp" alt="" loading="lazy" decoding="async">
          <div class="flow-carousel-textwrap"><span class="flow-carousel-label">Tell Obee about you</span></div>
        </div>
        <div class="flow-carousel-card">
          <img class="flow-carousel-img" src="assets/exploreyouroptions.webp" alt="" loading="lazy" decoding="async">
          <div class="flow-carousel-textwrap"><span class="flow-carousel-label">Explore your options</span></div>
        </div>
        <div class="flow-carousel-card">
          <img class="flow-carousel-img" src="assets/second-opinion.webp" alt="" loading="lazy" decoding="async">
          <div class="flow-carousel-textwrap"><span class="flow-carousel-label">Double check<br>with a second opinion</span></div>
        </div>
        <div class="flow-carousel-card">
          <img class="flow-carousel-img" src="assets/gut.webp" alt="" loading="lazy" decoding="async">
          <div class="flow-carousel-textwrap"><span class="flow-carousel-label">Refine and trust<br>your gut</span></div>
        </div>
        <div class="flow-carousel-card">
          <img class="flow-carousel-img" src="assets/career.webp" alt="" loading="lazy" decoding="async">
          <div class="flow-carousel-textwrap"><span class="flow-carousel-label">Launch a successful<br>career</span></div>
        </div>
      </div>
    </div>
    <div class="flow-carousel-dots">
      <span class="flow-dot"></span><span class="flow-dot"></span><span class="flow-dot"></span><span class="flow-dot"></span><span class="flow-dot"></span>
    </div>

    <!-- FAQ -->
    <div class="faq-section">
      <h2 class="faq-title">Frequently<br>asked questions</h2>
      <div class="faq-list">
        <div class="faq-row">
          <div class="faq-row-head"><span>What's different between Obee and just asking ChatGPT or Claude directly?</span><span class="faq-chevron"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 Q12 16 19 9"/></svg></span></div>
          <div class="faq-answer"><div class="faq-answer-inner">Anyone can open ChatGPT or Claude and ask for college advice, but a plain AI chat will answer confidently even when it's guessing, and only admit it later, "you're right, sorry, that's not accurate," once you catch the mistake yourself.<br><br>Obee is built specifically to prevent that. The intake isn't one or two questions, it's a full structured process built to gather exactly what a real admissions decision depends on (grades, courses, state, transfer units, timeline, and more), and if what you've shared still isn't enough to build a responsible list, Obee asks another question instead of guessing; it won't generate a list until it actually has what it needs. On top of that, every recommendation is checked against real, documented systems, like California's ASSIST, TAG, and IGETC transfer agreements, and explicitly tagged as verified when it's backed by that kind of hard data, general when it's a reasonable estimate, or unknown when there simply isn't a confident answer. A normal AI chat does none of that. It doesn't know when it's guessing, and it won't tell you until you push back.</div></div>
        </div>
        <div class="faq-row">
          <div class="faq-row-head"><span>How much does it cost?</span><span class="faq-chevron"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 Q12 16 19 9"/></svg></span></div>
          <div class="faq-answer"><div class="faq-answer-inner">Obee is completely free for students. No login, no accounts, just your email once so we can send you a copy of your list.</div></div>
        </div>
        <div class="faq-row">
          <div class="faq-row-head"><span>Does it replace traditional counseling?</span><span class="faq-chevron"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 Q12 16 19 9"/></svg></span></div>
          <div class="faq-answer"><div class="faq-answer-inner">No, Obee is a trustworthy starting point, not the final word. We always recommend verifying with your school counselor and each college's official site.</div></div>
        </div>
        <div class="faq-row">
          <div class="faq-row-head"><span>Is my/my child&rsquo;s information safe and private?</span><span class="faq-chevron"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 Q12 16 19 9"/></svg></span></div>
          <div class="faq-answer"><div class="faq-answer-inner">Yes. We don't require accounts, and your academic profile (grades, courses, extracurriculars) stays in your own browser, never on our servers. The one thing we collect is your email, used once to send you a copy of your list through our email provider, and not stored by us afterward.</div></div>
        </div>
      </div>
    </div>

    <!-- FINAL CTA -->
    <div class="final-cta">
      <div class="final-card">
        <img class="final-icon" src="assets/launchyourfuture.webp" alt="" loading="lazy" decoding="async">
        <h2>Ready to launch your future?</h2>
        <button class="cta-pill cta-pill--dark js-start" type="button">Let's Find Your College</button>
      </div>
    </div>

    <!-- FOOTER -->
    <footer class="site-footer">
      <img class="footer-logo" src="assets/obee-full-lockup-sm.png" alt="Obee, College Advisor" loading="lazy" decoding="async">
      <p class="footer-contact">Questions or inquiries? Contact us at <a href="mailto:team@hiobee.com">team@hiobee.com</a></p>
      <p class="footer-copy">&copy; 2026, built by a student, for students.</p>
    </footer>

  </section>
</template>

<template id="tpl-question-screen">
  <section class="screen question-screen">
    <div class="question-header">
      <div class="question-progress">
        <span class="question-progress-label"></span>
        <div class="question-progress-track"><div class="question-progress-fill"></div></div>
      </div>
      <h2 class="question-title"></h2>
      <p class="question-sub"></p>
    </div>
    <div class="question-body"></div>
    <div class="freeform-dock">
      <div class="freeform-box">
        <textarea class="freeform-input" rows="1" placeholder="Anything else you'd like to share?"></textarea>
        <button class="mic-btn" type="button" aria-label="Voice input">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10a7 7 0 0 0 14 0"></path>
            <line x1="12" y1="19" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </button>
      </div>
    </div>
    <div class="nav-row">
      <button class="back-btn" type="button">Back</button>
      <button class="skip-link" type="button">Skip</button>
      <button class="continue-btn" type="button" disabled>Continue</button>
    </div>
  </section>
</template>

<template id="tpl-thinking">
  <section class="screen thinking-screen">
    <div class="thinking-stage">
      <div class="thinking-blob-wrap">
        <span class="thinking-blob thinking-blob--purple"></span>
        <span class="thinking-blob thinking-blob--gold"></span>
        <span class="thinking-blob thinking-blob--lavender"></span>
      </div>
      <img class="thinking-icon-img" src="assets/loading.webp" alt="" decoding="async">
    </div>
    <p class="thinking-label">Thinking...</p>
  </section>
</template>

<template id="tpl-results">
  <section class="screen results-screen">
    <div class="results-header">
      <h2>Here's your college list</h2>
      <div class="results-actions">
        <button class="results-action-btn js-copy-link" type="button">&#x1F517; Copy link</button>
        <button class="results-action-btn js-resend-email" type="button">&#x1F4E7; Resend to email</button>
        <button class="results-action-btn results-action-btn--pdf js-download-pdf" type="button">Download PDF</button>
      </div>
    </div>
    <div class="results-body"></div>
    <div class="results-chat-dock">
      <div class="results-chat-messages"></div>
      <div class="freeform-box">
        <textarea class="results-chat-input" rows="1" placeholder="Ask a follow-up question..."></textarea>
        <button class="send-btn" type="button" aria-label="Send">&#10148;</button>
      </div>
    </div>
    <div class="results-disclaimer">
      Always verify with your target school's official transfer agreement or admissions office, and talk to your counselor before making final decisions.
    </div>
  </section>
</template>

<template id="tpl-limit-reached">
  <section class="screen limit-screen">
    <p class="limit-icon">&#x1F319;</p>
    <h2>Obee reached its limit</h2>
    <p class="limit-message"></p>
  </section>
</template>

<script src="js/steps.js"></script>
<script src="js/i18n.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
